<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
<title id="title">From base weights to flashable artifacts.</title><desc id="desc">ESP32-LLM-001  /  Recommended model workflow  /  Run Python modules from the repository root</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker></defs>
<rect width="1080" height="590" rx="18" fill="#f8fbfc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="46" font-size="25" fill="#142d3b" font-weight="700" text-anchor="start">From base weights to flashable artifacts.</text>
<text x="40" y="74" font-size="14" fill="#576b78" font-weight="400" text-anchor="start">ESP32-LLM-001  /  Recommended model workflow  /  Run Python modules from the repository root</text>
<rect x="40" y="120" width="290" height="140" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="58" y="149" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">01  PREPARE</text><text x="58" y="176" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Download Qwen2-0.5B</text><text x="58" y="197" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Crop vocabulary + embeddings</text><text x="58" y="218" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">tools.prepare</text>
<rect x="395" y="120" width="290" height="140" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="413" y="149" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">02  TRAIN</text><text x="413" y="176" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Ternary QAT + INT8 activations</text><text x="413" y="197" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Checkpoint and export weights</text><text x="413" y="218" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">tools.training.train_qat</text>
<rect x="750" y="120" width="290" height="140" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="768" y="149" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">03  EXPORT</text><text x="768" y="176" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Quantize INT4 embeddings</text><text x="768" y="197" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Pack tokenizer + board binaries</text><text x="768" y="218" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">tools.export</text>
<rect x="750" y="345" width="290" height="140" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="768" y="374" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">04  HOST CHECK</text><text x="768" y="401" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Decode packed model on CPU</text><text x="768" y="422" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Check output and artifact layout</text><text x="768" y="443" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">tools.validation.validate_int4</text>
<rect x="395" y="345" width="290" height="140" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="413" y="374" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">05  FLASH</text><text x="413" y="401" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Build master + node firmware</text><text x="413" y="422" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Flash firmware, then model data</text><text x="413" y="443" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">scripts/flash_data.py</text>
<rect x="40" y="345" width="290" height="140" rx="12" fill="#e9f5f5" stroke="#087f8c" stroke-width="1.5"/><text x="58" y="374" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">06  BOARD CHECK</text><text x="58" y="401" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Wire the seven-board chain</text><text x="58" y="422" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Inspect lane logs + serial output</text><text x="58" y="443" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Physical hardware required</text>
<path d="M330 190 H395" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M685 190 H750" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M895 260 V345" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750 415 H685" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M395 415 H330" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="535" font-size="14" fill="#142d3b" font-weight="400" text-anchor="start">Host decoding is a smoke check, not bit-exact emulation of the full firmware.</text>
<text x="40" y="560" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Artifacts: tokenizer.bin  •  embed.bin  •  final_norm.bin  •  six layers_START_to_END.bin files</text>
</g></svg>
