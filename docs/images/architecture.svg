<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
<title id="title">Seven boards. One inference pipeline.</title><desc id="desc">ESP32-LLM-001  /  Runtime topology  /  GPIO connections shown separately</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker></defs>
<rect width="1080" height="570" rx="18" fill="#f8fbfc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="46" font-size="25" fill="#142d3b" font-weight="700" text-anchor="start">Seven boards. One inference pipeline.</text>
<text x="40" y="74" font-size="14" fill="#576b78" font-weight="400" text-anchor="start">ESP32-LLM-001  /  Runtime topology  /  GPIO connections shown separately</text>
<rect x="40" y="125" width="210" height="155" rx="12" fill="#e9f5f5" stroke="#087f8c" stroke-width="1.5"/><text x="58" y="154" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">MASTER</text><text x="58" y="181" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">BPE + INT4 embeddings</text><text x="58" y="202" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Final RMS norm + LM head</text><text x="58" y="223" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Sampling + USB console</text>
<rect x="300" y="125" width="210" height="120" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="318" y="154" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">NODE 1</text><text x="318" y="181" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Transformer layers 0–3</text><text x="318" y="202" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Ternary weights + KV cache</text>
<rect x="550" y="125" width="210" height="120" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="568" y="154" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">NODE 2</text><text x="568" y="181" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Transformer layers 4–7</text><text x="568" y="202" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Ternary weights + KV cache</text>
<rect x="800" y="125" width="210" height="120" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="818" y="154" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">NODE 3</text><text x="818" y="181" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Transformer layers 8–11</text><text x="818" y="202" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Ternary weights + KV cache</text>
<rect x="800" y="345" width="210" height="120" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="818" y="374" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">NODE 4</text><text x="818" y="401" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Transformer layers 12–15</text><text x="818" y="422" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Ternary weights + KV cache</text>
<rect x="550" y="345" width="210" height="120" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="568" y="374" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">NODE 5</text><text x="568" y="401" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Transformer layers 16–19</text><text x="568" y="422" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Ternary weights + KV cache</text>
<rect x="300" y="345" width="210" height="120" rx="12" fill="#ffffff" stroke="#d6e2e7" stroke-width="1.5"/><text x="318" y="374" font-size="16" fill="#142d3b" font-weight="700" text-anchor="start">NODE 6</text><text x="318" y="401" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Transformer layers 20–23</text><text x="318" y="422" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Ternary weights + KV cache</text>
<path d="M250 185 H300" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M510 185 H550" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M760 185 H800" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M905 245 V345" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="300" font-size="12" fill="#087f8c" font-weight="400" text-anchor="start">SPI</text>
<path d="M800 405 H760" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550 405 H510" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M300 405 H145 V280" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="438" font-size="12" fill="#087f8c" font-weight="400" text-anchor="start">Return hidden state</text>
<text x="310" y="294" font-size="14" fill="#087f8c" font-weight="400" text-anchor="start">Float32 hidden states  •  10 MHz SPI, mode 0  •  4 KB frames</text>
<text x="40" y="511" font-size="14" fill="#142d3b" font-weight="400" text-anchor="start">Per board: 16 MB flash + 8 MB PSRAM. Six nodes execute 24 layers in sequence.</text>
<text x="40" y="537" font-size="13" fill="#576b78" font-weight="400" text-anchor="start">Model weights stay local. The master begins the next token after the result returns.</text>
</g></svg>
