name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/check_repository.py
      - run: python scripts/render_diagrams.py --check
      - run: python -m unittest discover -s tests -p test_repository.py -v
      - run: bash -n scripts/train_container.sh
  model-formats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -p test_model_formats.py -v
